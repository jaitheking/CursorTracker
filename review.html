<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Review — Jaiprashanth</title>
    <meta name="description" content="AI Performance Review modeled after Strava and Garmin.">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff5722">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .metric-card {
            background: var(--surface-raised);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
        }
        .metric-card h4 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        .metric-card p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .insight-list {
            padding-left: 20px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .insight-list li { margin-bottom: 6px; }
    </style>
</head>
<body>

<!-- Theme Toggle -->
<button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>

<div class="container">
    <a href="/index.html" class="nav-link">⬅️ Back to Dashboard</a>
    <h2>📈 Performance Review</h2>

    <div class="panel" style="margin-top: 16px;">
        <div class="grid-2" style="margin-bottom: 12px;">
            <div>
                <label for="startDate">Start Date (Monday)</label>
                <input type="date" id="startDate" required>
            </div>
            <div>
                <label for="endDate">End Date (Sunday)</label>
                <input type="date" id="endDate" required>
            </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
            <select id="chatModelSelect" style="padding: 8px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; flex: 1.5;" title="Switch model if one is under high demand">
                <option value="gemini-2.5-flash">✦ Gemini 2.5 Flash</option>
                <option value="gemini-2.5-pro">✦ Gemini 2.5 Pro</option>
                <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                <option value="gemini-3.8-pro">Gemini 3.8 Pro</option>
            </select>
            <button id="preset2Weeks" class="secondary-btn" style="flex: 1;">Last 2 Weeks</button>
            <button id="preset1Month" class="secondary-btn" style="flex: 1;">Last 1 Month</button>
        </div>
        <button id="generateReviewBtn" class="main-btn">⚡ Analyze Selected Period</button>
        <p id="reviewStatus"></p>
    </div>

    <div id="reviewOutputPanel" class="panel hidden">
        <h3 id="reviewTitle">Performance Breakdown</h3>
        
        <div class="metric-card">
            <h4>Summary</h4>
            <p id="reviewSummary"></p>
        </div>

        <div class="metric-card">
            <h4>Key Insights</h4>
            <ul id="reviewInsights" class="insight-list"></ul>
        </div>

        <!-- Running View -->
        <div class="metric-card" id="runningView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h4>🏃‍♂️ Running Performance</h4>
                <button type="button" class="secondary-btn" id="fsRunningBtn" style="padding: 4px 8px; font-size: 0.8rem;">⛶ Fullscreen</button>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 12px; font-size: 0.9rem; flex-wrap: wrap;">
                <div style="background: #333; padding: 8px; border-radius: 4px;">Dist: <span id="runTotalDist" style="font-weight: bold;">--</span></div>
                <div style="background: #333; padding: 8px; border-radius: 4px;">Pace: <span id="runAvgPace" style="font-weight: bold;">--</span></div>
                <div style="background: #333; padding: 8px; border-radius: 4px;">HR: <span id="runAvgHR" style="font-weight: bold;">--</span></div>
            </div>
            
            <div id="runningChartsContainer" style="display: grid; grid-template-columns: 1fr; gap: 16px;">
                <div>
                    <h5 style="margin-bottom: 4px; color: #ccc;">Heart Rate vs Type</h5>
                    <canvas id="runHRChart" height="180"></canvas>
                </div>
                <div>
                    <h5 style="margin-bottom: 4px; color: #ccc;">Pace vs Type</h5>
                    <canvas id="runPaceChart" height="180"></canvas>
                </div>
                <div>
                    <h5 style="margin-bottom: 4px; color: #ccc;">Distance vs Type</h5>
                    <canvas id="runDistChart" height="180"></canvas>
                </div>
            </div>
        </div>

        <!-- Strength View -->
        <div class="metric-card" id="strengthView">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h4>🏋️‍♂️ Strength Performance</h4>
                <button type="button" class="secondary-btn" id="fsStrengthBtn" style="padding: 4px 8px; font-size: 0.8rem;">⛶ Fullscreen</button>
            </div>
            <div style="display: flex; gap: 10px; margin-bottom: 12px; font-size: 0.9rem; flex-wrap: wrap;">
                <div style="background: #333; padding: 8px; border-radius: 4px;">Time: <span id="strengthTotalTime" style="font-weight: bold;">--</span></div>
                <div style="background: #333; padding: 8px; border-radius: 4px;">HR: <span id="strengthAvgHR" style="font-weight: bold;">--</span></div>
            </div>
            <div style="margin-top: 10px;" id="strengthChartContainer">
                <canvas id="gymChart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/scripts/lucide.min.js"></script>
<script type="module" src="/scripts/review.js"></script>
<script>
    (function() {
        const t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
            btn?.addEventListener('click', () => {
                const cur = document.documentElement.getAttribute('data-theme');
                const next = cur === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                btn.textContent = next === 'dark' ? '☀️' : '🌙';
            });
        });
    })();
</script>
</body>
</html>
